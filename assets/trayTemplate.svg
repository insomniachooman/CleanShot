<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C8BF5"/>
      <stop offset="100%" stop-color="#7AA7FF"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#9FD0FF"/>
      <stop offset="45%" stop-color="#4C8BF5"/>
      <stop offset="100%" stop-color="#173A8F"/>
    </radialGradient>
  </defs>

  <!-- Circular badge for maximum contrast on both light/dark trays -->
  <circle cx="128" cy="128" r="118" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Camera body -->
  <rect x="56" y="88" width="144" height="96" rx="20" fill="#FFFFFF"/>
  <!-- Top strip/shutter housing -->
  <rect x="72" y="76" width="72" height="18" rx="9" fill="#EAF0FF"/>

  <!-- Lens ring (thick so it reads at 16px) -->
  <circle cx="128" cy="136" r="44" fill="none" stroke="#0F2F82" stroke-width="14" stroke-opacity="0.85"/>

  <!-- Lens glass -->
  <circle cx="128" cy="136" r="30" fill="url(#lens)"/>

  <!-- Lens highlight -->
  <circle cx="114" cy="122" r="7" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Small flash dot -->
  <circle cx="174" cy="108" r="6" fill="#4C8BF5"/>

  <!-- Subtle inner shadow to add depth -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="6"/>

  <!-- Hint line at camera base for separation -->
  <rect x="64" y="170" width="128" height="6" rx="3" fill="#E1E9FF"/>
</svg>
