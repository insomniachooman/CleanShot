<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanShot Capture</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div class="snip-root" data-role="root">
      <div class="scrim" data-role="scrim"></div>
      <div class="selection" data-role="selection" hidden>
        <span class="selection-size" data-role="size"></span>
      </div>
      <div class="hint" data-role="hint">
        <span>Click and drag to capture an area.</span>
        <span>Press Enter for full display · Esc to cancel.</span>
      </div>
    </div>

    <script type="module" src="overlay.js"></script>
  </body>
</html>
